<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&N: DERIVE PROJECT</title>

    <!-- Preconnects: Forces the browser to load the font instantly -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">

    <!-- SunCalc Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>

    <!-- Leaflet CSS for the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Map takes up the whole screen */
        #map {
            width: 100%;
            height: 100%;
        }

        /* The overlay that requires the user to click so audio can play */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #start-btn {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Roboto Mono', monospace;
            background-color: #0000ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #start-btn:hover {
            background-color: #0000ff;
        }

        /* The floating panel for the images */
        #image-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 350px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            text-align: center;
        }

        #image-panel img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }

        #image-panel h2 {
            margin: 0;
            color: #333;
        }

        .location-tooltip {
            border: 0;
            border-radius: 4px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            color: #333;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 9px;
            font-family: 'Roboto Mono', monospace;
        }

        /* Random Button styling */
        #random-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            cursor: pointer;
            z-index: 1000;
        }

        #random-btn img {
            transition: transform 0.2s ease, filter 0.2s ease;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.4));
        }

        #random-btn:hover img {
            transform: scale(1.15);
            filter: drop-shadow(0px 6px 8px rgba(0, 0, 0, 0.5)) brightness(1.2);
        }

       /* Radius UI Container (Increased Size) */
        #radius-ui {
            position: absolute;
            bottom: 230px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 480px;  /* Increased from 250px to make the graphic wider */
            height: 280px; /* Increased from 120px to make the graphic taller */
            display: none; 
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        .radius-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .radius-input-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* We removed position: relative; so flexbox can't squish it! */
        }

        /* The transparent input with NO bottom line */
        #radius-input {
            position: absolute;
            left: 160px;   /* INCREASE this to move the number to the RIGHT */
            bottom: 140px; /* INCREASE this to move the number UP */
            width: 90px;
            background: transparent;
            border: none;
            color: white;
            font-family: 'Roboto Mono', monospace;
            font-size: 30px; 
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        /* Hides the up/down arrows inside the number input */
        #radius-input::-webkit-outer-spin-button,
        #radius-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        #radius-input[type=number] {
            -moz-appearance: textfield;
        }
        #corner-logo {
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 1000;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.3));
        }

        /* Bottom Reveal Buttons */
        #reveal-routes-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        #reveal-locations-btn {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        #reveal-routes-btn img,
        #reveal-locations-btn img {
            display: block;
            width: 190px;
            height: 190px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        #reveal-routes-btn:hover img,
        #reveal-locations-btn:hover img {
            transform: scale(1.15);
            filter: drop-shadow(0px 6px 8px rgba(0, 0, 0, 0.5)) brightness(1.2);
        }

        #reveal-routes-btn:disabled {
            cursor: wait;
            opacity: 0.65;
        }

       /* Sky Dome CSS */
        #sky-dome {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1400px; 
            height: 1400px; 
            z-index: 1500; 
            pointer-events: none; 
            display: none; 
            border-radius: 50%;
        }

        #dome-graphic {
            width: 100%;
            height: 100%;
            opacity: 0.8;
            color: transparent; 
        }

        /* The line shooting out from the center */
        #celestial-pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px; 
            height: 60%; 
            background-color: transparent; 
            transform-origin: bottom center; 
            transform: translate(-50%, -100%) rotate(0deg);
            display: none;
        }

        /* The little dot at the center point */
        #celestial-pointer::after {
            content: '';
            position: absolute;
            bottom: 0; 
            left: 50%;
            transform: translate(-50%, 50%);
            width: 12px; 
            height: 12px;
            background-color: inherit; 
            border-radius: 50%;
        }

        /* Sun and Moon Button Containers */
        #toggle-sun-btn, #toggle-moon-btn {
            position: absolute;
            right: 20px; 
            z-index: 1000;
            padding: 0;
            border: none;
            background: transparent !important;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
        }

        #toggle-sun-btn { top: 20px; }
        #toggle-moon-btn { top: 160px; } 

        /* BIG Sun Image */
        #toggle-sun-btn img {
            display: block;
            width: 130px;
            height: 130px;
            background: transparent !important;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        /* REGULAR Moon Image */
        #toggle-moon-btn img {
            display: block;
            width: 90px;
            height: 90px;
            background: transparent !important;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        /* Hover Effects */
        #toggle-sun-btn:hover img, #toggle-moon-btn:hover img {
            transform: scale(1.15);
            filter: brightness(1.2);
        }

        /* Minimal Altitude Readout styling */
        .alt-readout {
            position: absolute;
            right: 150px; 
            color: black !important; 
            background: transparent; 
            font-family: 'Roboto Mono', monospace;
            font-size: 14px; 
            font-weight: bold;
            z-index: 1000;
            display: none; 
            pointer-events: none;
        }

        #sun-alt { top: 70px; } 
        #moon-alt { top: 195px; }
    </style>
</head>

<body>
    <!-- Corner Logo / SVG -->
    <div id="corner-logo">
        <img src="derive.svg" alt="Corner Graphic" width="250" height="250">
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay">
        <button id="start-btn">I want to dérive!</button>
    </div>

    <!-- Sky Dome HUD (Centered on screen) -->
    <div id="sky-dome">
        <img id="dome-graphic" src="" alt="Sky Paths" style="display: none;">
        <div id="celestial-pointer"></div>
    </div>
    
    <!-- Minimal Altitude Readouts -->
    <div id="sun-alt" class="alt-readout"></div>
    <div id="moon-alt" class="alt-readout"></div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Sun and Moon Buttons -->
    <button id="toggle-sun-btn" type="button" aria-label="Toggle Sun Path">
        <img src="sun.svg" alt="">
    </button>
    <button id="toggle-moon-btn" type="button" aria-label="Toggle Moon Path">
        <img src="moon.svg" alt="">
    </button>
    
    <!-- Bottom Reveal Buttons -->
    <button id="reveal-routes-btn" type="button" aria-label="Reveal Routes" disabled>
        <img src="revealroutes.svg" alt="Reveal Routes">
    </button>
    <button id="reveal-locations-btn" type="button" aria-label="Reveal Locations">
        <img src="reveallocs.svg" alt="Reveal Locations">
    </button>

    <!-- Hover Info Panel -->
    <div id="image-panel">
        <h2 id="location-title">Location Name</h2>
        <img id="location-image" src="" alt="Location Image">
    </div>

    <!-- Radius Setter UI (Pops up above Discover button) -->
    <div id="radius-ui">
        <img src="miles-bg.svg" alt="Miles Background" class="radius-bg">
        <div class="radius-input-container">
            <input type="number" id="radius-input" value="1" min="0.1" step="0.1">
        </div>
    </div>

    <!-- Random Button -->
    <button id="random-btn" title="Take Me Somewhere Random">
        <img src="drawing.svg" alt="Random Button" width="190" height="190">
    </button>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        document.getElementById('start-btn').addEventListener('click', function () {
            document.getElementById('start-overlay').style.display = 'none';
        });

        const defaultCenter = [51.505, -0.12];
        const defaultZoom = 12;
        const hoverZoom = 16;

        const map = L.map('map', {
            renderer: L.svg({ padding: 100 })
        }).setView(defaultCenter, defaultZoom);

        L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png?api_key=1bf3ab1a-b4c9-4760-8370-d3a1c2cbe472', {
            maxZoom: 20,
            attribution: '© Stadia Maps, © OpenMapTiles, © OpenStreetMap contributors'
        }).addTo(map);

        const locations = [
            {
                name: "Ben's flat",
                lat: 51.481726559335236,
                lng: -0.12151946558093002,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                image: "https://i.postimg.cc/BQ4rYyKK/360-F-662665020-Cy-Vsy-GUH5n-BJUNmoabu-XM1BJZ5WUSIUW.jpg"
            },
            {
                name: "Site of the 'LATM' accident",
                lat: 51.50593956691568,
                lng: -0.12268025393587462,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                image: "https://i.postimg.cc/y65c647w/B303DEC2-ECA5-4568-A336-860F0AD8049D-1-105-c.jpg"
            },
            {
                name: "Old Habits Tattoo",
                lat: 51.54053902859313,
                lng: -0.07632860392741424,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                image: "https://i.postimg.cc/C12BKkVy/6F9BBA0E-07C9-4DB5-859A-157E966F6C3F-1-105-c.jpg"
            },
            {
                name: "Natalia's Work",
                lat: 51.499799355451984,
                lng: -0.11616712991588761,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3",
                image: "https://i.postimg.cc/9XybMMwb/2.jpg"
            },
            {
                name: "Bens work",
                lat: 51.52098215713204,
                lng: -0.10177203697336816,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3",
                image: "https://i.postimg.cc/Df16ZZ4j/3.jpg"
            },
            {
                name: "Haggerston Park, Doms Subs",
                lat: 51.534377980410895,
                lng: -0.06931715609614852,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3",
                image: "https://i.postimg.cc/NjbBwBxv/image-1.jpg"
            },
            {
                name: "Natalia's House",
                lat: 51.4705230902746,
                lng: -0.04353143793877728,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                image: "https://i.postimg.cc/NGRDMM2N/Whats-App-Image-2026-09-30-at-23-04-55.jpg"
            },
            {
                name: "Our Spot",
                lat: 51.52057728063879,
                lng: -0.09589475851021564,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3",
                image: "https://i.postimg.cc/c1fhHHtk/5.jpg"
            },
             {
                name: "one million pound lunch from whole foods",
                lat: 51.505250,
                lng: -0.180972,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                image: "https://i.postimg.cc/zB7FBw0Y/Ken-Pond.png"
            },
        ];

        let currentAudio = null;
        const imagePanel = document.getElementById('image-panel');
        const locationTitle = document.getElementById('location-title');
        const locationImage = document.getElementById('location-image');

        const myCustomIcon = L.icon({
            iconUrl: 'star.svg',
            iconSize: [50, 50],
            iconAnchor: [20, 40],
            popupAnchor: [0, -40]
        });
        const discoveryIcon = L.icon({
            iconUrl: 'star_blue.svg',
            iconSize: [50, 50],
            iconAnchor: [25, 25],
            popupAnchor: [0, -25]
        });

        const locationMarkers = [];

        locations.forEach(loc => {
            const marker = L.marker([loc.lat, loc.lng], { icon: myCustomIcon }).addTo(map);
            marker.getElement().style.transition = 'opacity 1s ease';
            marker.getElement().style.opacity = '0';
            marker.getElement().style.pointerEvents = 'none';
            marker.bindTooltip(loc.name, {
                className: 'location-tooltip',
                direction: 'top',
                offset: [0, -35]
            });
            locationMarkers.push(marker);

            marker.on('click', (event) => {
                L.DomEvent.stopPropagation(event.originalEvent);
                map.flyTo([loc.lat, loc.lng], hoverZoom, {
                    animate: true,
                    duration: 1.5
                });
                locationTitle.textContent = loc.name;
                locationImage.src = loc.image;
                imagePanel.style.opacity = 1;

                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                currentAudio = new Audio(loc.audio);
                currentAudio.play().catch(e => console.log("Audio requires user interaction first."));
            });
        });

        let locationsVisible = false;
        document.getElementById('reveal-locations-btn').addEventListener('click', () => {
            locationsVisible = !locationsVisible;
            const locationsButton = document.getElementById('reveal-locations-btn');
            locationsButton.setAttribute('aria-label', locationsVisible ? 'Hide Locations' : 'Reveal Locations');

            locationMarkers.forEach(marker => {
                const markerElement = marker.getElement();
                const revealDelay = `${Math.random() * 0.8}s`;
                markerElement.style.transition = locationsVisible
                    ? `opacity 1s ease ${revealDelay}`
                    : `opacity 0.7s ease ${revealDelay}`;
                markerElement.style.opacity = locationsVisible ? '1' : '0';
                markerElement.style.pointerEvents = locationsVisible ? 'auto' : 'none';
            });

            if (!locationsVisible) {
                imagePanel.style.opacity = 0;
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
            }
        });

        // --- UPDATED DISCOVER RADIUS TOOL LOGIC ---
        let currentRandomPin = null;
        let isDiscoverMode = false;
        let discoverCircle = null;
        let discoverCenter = null;
        const radiusUi = document.getElementById('radius-ui');
        const radiusInput = document.getElementById('radius-input');

        document.getElementById('random-btn').addEventListener('click', () => {
            if (!isDiscoverMode) {
                // TURN MODE ON: Show UI and draw the circle outline
                isDiscoverMode = true;
                radiusUi.style.display = 'flex';
                discoverCenter = map.getCenter();
                const radiusMiles = parseFloat(radiusInput.value) || 1;
                const radiusMeters = radiusMiles * 1609.34;
                
                discoverCircle = L.circle(discoverCenter, {
                    color: '#0000ff',
                    fill: false, /* Removes the blue fill completely */
                    weight: 2
                }).addTo(map);
                
                radiusInput.focus(); 
            } else {
                // BUTTON CLICKED AGAIN: Execute the jump!
                if (currentRandomPin) {
                    map.removeLayer(currentRandomPin);
                }

                const radiusMiles = parseFloat(radiusInput.value) || 1;
                const radiusMeters = radiusMiles * 1609.34;
                
                const r = radiusMeters * Math.sqrt(Math.random());
                const theta = Math.random() * 2 * Math.PI;

                const dy = r * Math.sin(theta);
                const dx = r * Math.cos(theta);
                
                const latOffset = dy / 111320;
                const lngOffset = dx / (111320 * Math.cos(discoverCenter.lat * Math.PI / 180));
                
                const randomLat = discoverCenter.lat + latOffset;
                const randomLng = discoverCenter.lng + lngOffset;

                currentRandomPin = L.marker([randomLat, randomLng], { icon: discoveryIcon }).addTo(map);

                map.flyTo([randomLat, randomLng], hoverZoom, {
                    animate: true,
                    duration: 3
                });

                currentRandomPin.bindPopup(`
                    <strong>Random Discovery</strong><br>
                    Lat: ${randomLat.toFixed(4)}<br>
                    Lng: ${randomLng.toFixed(4)}
                `, {
                    className: 'floating-text-popup',
                    offset: [0, -30]
                }).openPopup();

                currentRandomPin.on('popupclose', () => {
                    if (currentRandomPin) {
                        map.removeLayer(currentRandomPin);
                        currentRandomPin = null;
                    }
                });
                
                exitDiscoverMode(); // Closes UI and removes circle
            }
        });

        function exitDiscoverMode() {
            isDiscoverMode = false;
            radiusUi.style.display = 'none';
            if (discoverCircle) {
                map.removeLayer(discoverCircle);
                discoverCircle = null;
            }
        }

        map.on('click', (e) => {
            if (isDiscoverMode && discoverCircle) {
                discoverCenter = e.latlng;
                discoverCircle.setLatLng(discoverCenter);
            } else {
                imagePanel.style.opacity = 0;
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                map.flyTo(defaultCenter, defaultZoom, {
                    animate: true,
                    duration: 3
                });
            }
        });

        radiusInput.addEventListener('input', () => {
            if (isDiscoverMode && discoverCircle) {
                const radiusMiles = parseFloat(radiusInput.value) || 0;
                const radiusMeters = radiusMiles * 1609.34;
                discoverCircle.setRadius(radiusMeters);
            }
        });

        // --- MULTIPLE GPX FILE LOADER ---
        const gpxFiles = ['BensCommutev1.gpx', '4th Oct_Ken Pond.gpx'];
        
        let loadedGpxCount = 0;
        const allRoutesGroup = L.featureGroup().addTo(map);

        const revealRoutesButton = document.getElementById('reveal-routes-btn');
        let routePaths = [];
        let routeMarkers = [];
        let routesRevealed = false;

        gpxFiles.forEach(file => {
            new L.GPX(file, {
                async: true,
                polyline_options: {
                    color: '#0000ff',
                    weight: 3,
                    opacity: 0.85,
                    lineCap: 'round'
                },
                marker_options: {
                    startIconUrl: 'bluedot.svg',
                    endIconUrl: 'bluedot.svg',
                    iconSize: [25, 25],
                    iconAnchor: [12.5, 12.5],
                    shadowUrl: null
                }
            }).on('loaded', function (e) {
                loadedGpxCount++;
                
                if (loadedGpxCount === gpxFiles.length) {
                    map.fitBounds(allRoutesGroup.getBounds(), { animate: false });

                    requestAnimationFrame(() => {
                        routeMarkers = [...document.querySelectorAll('.leaflet-marker-icon[src$="bluedot.svg"]')];
                        routeMarkers.forEach(marker => {
                            marker.style.opacity = '0';
                            marker.style.transition = 'opacity 0.5s ease';
                        });

                        routePaths = [...document.querySelectorAll('.leaflet-overlay-pane path')];

                        let totalRouteLength = 0;
                        routePaths.forEach(routePath => {
                            totalRouteLength += routePath.getTotalLength();
                        });

                        const TOTAL_ANIMATION_TIME = 3;
                        let accumulatedDelay = 0;

                        routePaths.forEach(routePath => {
                            const routeLength = routePath.getTotalLength();
                            routePath.dataset.totalLength = routeLength;

                            routePath.style.strokeDasharray = routeLength;
                            routePath.style.strokeDashoffset = routeLength;
                            routePath.style.opacity = '0';

                            const segmentDuration = (routeLength / totalRouteLength) * TOTAL_ANIMATION_TIME;

                            routePath.dataset.drawTransition = `stroke-dashoffset ${segmentDuration}s linear ${accumulatedDelay}s, opacity 0.2s ease`;
                            routePath.dataset.hideTransition = `stroke-dashoffset 1s ease 0s, opacity 1s ease`;

                            accumulatedDelay += segmentDuration;
                        });

                        revealRoutesButton.disabled = false;
                    });
                }
            }).addTo(allRoutesGroup);
        });

        revealRoutesButton.addEventListener('click', () => {
            routesRevealed = !routesRevealed;
            revealRoutesButton.setAttribute('aria-label', routesRevealed ? 'Hide Routes' : 'Reveal Routes');

            if (routesRevealed) {
                routeMarkers.forEach(marker => marker.style.opacity = '1');
                routePaths.forEach(routePath => {
                    routePath.style.transition = routePath.dataset.drawTransition;
                    routePath.style.opacity = '0.85';
                    routePath.style.strokeDashoffset = '0';
                });
            } else {
                routeMarkers.forEach(marker => marker.style.opacity = '0');
                routePaths.forEach(routePath => {
                    routePath.style.transition = routePath.dataset.hideTransition;
                    routePath.style.strokeDashoffset = routePath.dataset.totalLength;
                    routePath.style.opacity = '0';
                });
            }
        });

        // --- SUN & MOON MATH LOGIC ---
        const skyDome = document.getElementById('sky-dome');
        const domeGraphic = document.getElementById('dome-graphic');
        const celestialPointer = document.getElementById('celestial-pointer');
        const sunAltBox = document.getElementById('sun-alt');
        const moonAltBox = document.getElementById('moon-alt');

        const londonLat = 51.505;
        const londonLng = -0.120;
        const monthNames = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];

        let sunActive = false;
        let moonActive = false;

        document.getElementById('toggle-sun-btn').addEventListener('click', () => {
            sunActive = !sunActive; 
            
            if (sunActive) {
                moonActive = false;
                moonAltBox.style.display = 'none';

                const now = new Date();
                const currentMonthName = monthNames[now.getMonth()]; 
                
                domeGraphic.src = `sun-paths-${currentMonthName}.svg`; 
                domeGraphic.style.display = 'block';

                const sunPos = SunCalc.getPosition(now, londonLat, londonLng);
                const compassAngle = (sunPos.azimuth * 180 / Math.PI) + 180; 
                const altitudeDegrees = (sunPos.altitude * 180 / Math.PI).toFixed(1); 

                skyDome.style.display = 'block';
                celestialPointer.style.display = 'block';
                celestialPointer.style.backgroundColor = '#FFFFFF'; /* Pure White */
                celestialPointer.style.transform = `translate(-50%, -100%) rotate(${compassAngle}deg)`;
                
                sunAltBox.innerHTML = `${altitudeDegrees}&deg;`;
                sunAltBox.style.display = 'block';
            } else {
                skyDome.style.display = 'none';
                sunAltBox.style.display = 'none';
            }
        });

        document.getElementById('toggle-moon-btn').addEventListener('click', () => {
            moonActive = !moonActive; 
            
            if (moonActive) {
                sunActive = false;
                sunAltBox.style.display = 'none';

                const now = new Date();
                const currentMonthName = monthNames[now.getMonth()]; 
                
                domeGraphic.src = `moon-paths-${currentMonthName}.svg`;
                domeGraphic.style.display = 'block';

                const moonPos = SunCalc.getMoonPosition(now, londonLat, londonLng);
                const compassAngle = (moonPos.azimuth * 180 / Math.PI) + 180;
                const altitudeDegrees = (moonPos.altitude * 180 / Math.PI).toFixed(1);

                skyDome.style.display = 'block';
                celestialPointer.style.display = 'block';
                celestialPointer.style.backgroundColor = '#C0C0C0'; /* Silver */
                celestialPointer.style.transform = `translate(-50%, -100%) rotate(${compassAngle}deg)`;
                
                moonAltBox.innerHTML = `${altitudeDegrees}&deg;`;
                moonAltBox.style.display = 'block';
            } else {
                skyDome.style.display = 'none';
                moonAltBox.style.display = 'none';
            }
        });
    </script>
</body>

</html>
