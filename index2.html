<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&N: DERIVE PROJECT</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS for the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
        }

        /* Map takes up the whole screen */
        #map {
            width: 100%;
            height: 100%;
        }

        /* The overlay that requires the user to click so audio can play */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            /* Stays on top of everything */
        }

        #start-btn {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Roboto Mono', monospace;
            background-color: #0000ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #start-btn:hover {
            background-color: #0000ff;
        }

        /* The floating panel for the images */
        #image-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 350px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            /* Stays on top of the map */
            opacity: 0;
            pointer-events: none;
            /* Let clicks pass through to the map */
            transition: opacity 0.4s ease;
            text-align: center;
        }

        #image-panel img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }

        #image-panel h2 {
            margin: 0;
            color: #333;
        }

        .location-tooltip {
            border: 0;
            border-radius: 4px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            color: #333;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 9px;
            font-family: 'Roboto Mono', monospace;
        }

        #random-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            /* Centers the button perfectly */
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Roboto Mono', monospace;
            background-color: #0078A8;
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 1000;
            /* Stays above the map */
            transition: background-color 0.3s, transform 0.2s;
        }

        /* 1. Make the button container invisible */
        #random-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);

            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            /* Remove default padding so the click area perfectly matches the SVG */

            cursor: pointer;
            z-index: 1000;
        }

        /* Control the image inside the button */
        #random-btn img {
            transition: transform 0.2s ease, filter 0.2s ease;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.4));
            /* Adds a shadow */
        }

        /* Makes the image grow and become slightly brighter on hover */
        #random-btn:hover img {
            transform: scale(1.15);
            filter: drop-shadow(0px 6px 8px rgba(0, 0, 0, 0.5)) brightness(1.2);
        }

        #corner-logo {
            position: absolute;
            top: 10px;
            /* Distance from the top of the screen */
            left: 20px;
            /* Distance from the left of the screen */
            z-index: 1000;
            /* Stays above the map tiles */

            /* Optional: Add a subtle drop shadow to separate it from the map */
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.3));
        }

        #reveal-routes-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        #reveal-routes-btn img {
            display: block;
            width: 190px;
            height: 190px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        #reveal-routes-btn:hover img,
        #reveal-locations-btn:hover img {
            transform: scale(1.15);
            filter: drop-shadow(0px 6px 8px rgba(0, 0, 0, 0.5)) brightness(1.2);
        }

        #reveal-routes-btn:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        #reveal-locations-btn {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        #reveal-locations-btn img {
            display: block;
            width: 190px;
            height: 190px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
    </style>
</head>

<body>
    <!-- Corner Logo / SVG -->
    <div id="corner-logo">
        <!-- Option A: Link to a file -->
        <img src="derive.svg" alt="Corner Graphic" width="250" height="250">

        <!-- Option B: Or paste raw <svg> ... </svg> code right here -->
    </div>
    <!-- Start Overlay -->
    <div id="start-overlay">
        <button id="start-btn">I want to dérive!</button>
    </div>

    <!-- Map Container -->
    <div id="map"></div>
    <button id="reveal-routes-btn" type="button" aria-label="Reveal Routes" disabled>
        <img src="revealroutes.svg" alt="Reveal Routes">
    </button>
    <button id="reveal-locations-btn" type="button" aria-label="Reveal Locations">
        <img src="reveallocs.svg" alt="Reveal Locations">
    </button>

    <!-- Hover Info Panel -->
    <div id="image-panel">
        <h2 id="location-title">Location Name</h2>
        <img id="location-image" src="" alt="Location Image">
    </div>
    <!-- ADD THIS NEW BUTTON -->
    <!-- Replace the text button with an SVG button -->
    <button id="random-btn" title="Take Me Somewhere Random">

        <!-- Paste your custom SVG code right here -->
        <img src="drawing.svg" alt="Random Button" width="190" height="190">
        <circle cx="12" cy="12" r="10"></circle>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>

    </button>


    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        // 1. Remove the start overlay when clicked (unlocks audio)
        document.getElementById('start-btn').addEventListener('click', function () {
            document.getElementById('start-overlay').style.display = 'none';
        });

        // 2. Initialize the map centered on London
                // 2. Initialize the map centered on London (WITH CUSTOM RENDERER)
        const defaultCenter = [51.505, -0.12];
        const defaultZoom = 12;
        const hoverZoom = 16;

        // The padding: 100 ensures the line is never cut off by screen boundaries
        const map = L.map('map', { 
            renderer: L.svg({ padding: 100 }) 
        }).setView(defaultCenter, defaultZoom);


        
        // Stadia Maps Alidade Smooth (Soft Light)
        L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png?api_key=1bf3ab1a-b4c9-4760-8370-d3a1c2cbe472', {
            maxZoom: 20,
            attribution: '© Stadia Maps, © OpenMapTiles, © OpenStreetMap contributors'
        }).addTo(map);
        



        // 3. Define your locations, images, and audio here!
        const locations = [
            // --- ORIGINAL LOCATIONS ---
            {
                name: "Ben's flat",
                lat: 51.481726559335236,
                lng: -0.12151946558093002,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                image: "https://i.postimg.cc/BQ4rYyKK/360-F-662665020-Cy-Vsy-GUH5n-BJUNmoabu-XM1BJZ5WUSIUW.jpg"
            },
            {
                name: "Site of the 'LATM' accident",
                lat: 51.50593956691568,
                lng: -0.12268025393587462,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                image: "https://i.postimg.cc/y65c647w/B303DEC2-ECA5-4568-A336-860F0AD8049D-1-105-c.jpg"
            },
            {
                name: "Old Habits Tattoo",
                lat: 51.54053902859313,
                lng: -0.07632860392741424,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                image: "https://i.postimg.cc/C12BKkVy/6F9BBA0E-07C9-4DB5-859A-157E966F6C3F-1-105-c.jpg"
            },
            
            // --- NEW LOCATIONS ---
            {
                name: "Natalia's Work",
                lat: 51.499799355451984,
                lng: -0.11616712991588761,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3",
                image: "https://i.postimg.cc/9XybMMwb/2.jpg" 
            },
            {
                name: "Bens work",
                lat: 51.52098215713204,
                lng: -0.10177203697336816,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3",
                image: "https://i.postimg.cc/Df16ZZ4j/3.jpg" 
            },
            {
                name: "Haggerston Park, Doms Subs",
                lat: 51.534377980410895,
                lng: -0.06931715609614852,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3",
                image: "https://i.postimg.cc/NjbBwBxv/image-1.jpg" 
            },
            {
                name: "Natalia's House",
                lat: 51.4705230902746,
                lng: -0.04353143793877728,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                image: "https://i.postimg.cc/NGRDMM2N/Whats-App-Image-2026-09-30-at-23-04-55.jpg" 
            },
            {
                name: "Our Spot",
                lat: 51.52057728063879,
                lng: -0.09589475851021564,
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3",
                image: "https://i.postimg.cc/c1fhHHtk/5.jpg" 
            }
        ];

        let currentAudio = null;
        const imagePanel = document.getElementById('image-panel');
        const locationTitle = document.getElementById('location-title');
        const locationImage = document.getElementById('location-image');

        // Define your custom map pin image
        const myCustomIcon = L.icon({
            iconUrl: 'star.svg', // Replace with your image link
            iconSize: [50, 50],     // The width and height of the image in pixels
            iconAnchor: [20, 40],   // The exact point of the image that touches the map (bottom center)
            popupAnchor: [0, -40]   // Where the popup should open relative to the pin
        });
        const discoveryIcon = L.icon({
            iconUrl: 'star_blue.svg',
            iconSize: [50, 50],
            iconAnchor: [25, 25],
            popupAnchor: [0, -25]
        });

        const locationMarkers = [];

        // 4. Create pins and marker interactions
        locations.forEach(loc => {
            // Change this line:
            // const marker = L.marker([loc.lat, loc.lng]).addTo(map);

            // To this:
            const marker = L.marker([loc.lat, loc.lng], { icon: myCustomIcon }).addTo(map);
            marker.getElement().style.transition = 'opacity 1s ease';
            marker.getElement().style.opacity = '0';
            marker.getElement().style.pointerEvents = 'none';
            marker.bindTooltip(loc.name, {
                className: 'location-tooltip',
                direction: 'top',
                offset: [0, -35]
            });
            locationMarkers.push(marker);

            marker.on('click', (event) => {
                L.DomEvent.stopPropagation(event.originalEvent);

                map.flyTo([loc.lat, loc.lng], hoverZoom, {
                    animate: true,
                    duration: 1.5
                });

                // Set up and show the image panel
                locationTitle.textContent = loc.name;
                locationImage.src = loc.image;
                imagePanel.style.opacity = 1;

                // Stop any currently playing audio and start the new one
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                currentAudio = new Audio(loc.audio);
                currentAudio.play().catch(e => console.log("Audio requires user interaction first."));
            });
        });

        let locationsVisible = false;
        document.getElementById('reveal-locations-btn').addEventListener('click', () => {
            locationsVisible = !locationsVisible;
            const locationsButton = document.getElementById('reveal-locations-btn');
            locationsButton.setAttribute('aria-label', locationsVisible ? 'Hide Locations' : 'Reveal Locations');

            locationMarkers.forEach(marker => {
                const markerElement = marker.getElement();
                const revealDelay = `${Math.random() * 0.8}s`;
                markerElement.style.transition = locationsVisible
                    ? `opacity 1s ease ${revealDelay}`
                    : `opacity 0.7s ease ${revealDelay}`;
                markerElement.style.opacity = locationsVisible ? '1' : '0';
                markerElement.style.pointerEvents = locationsVisible ? 'auto' : 'none';
            });

            if (!locationsVisible) {
                imagePanel.style.opacity = 0;
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
            }
        });

        // We need a variable to keep track of the random pin so we can delete it later
        let currentRandomPin = null;


        // 5. Random Coordinates Button Logic
        document.getElementById('random-btn').addEventListener('click', () => {

            // If there's already a random pin on the map, remove it first
            if (currentRandomPin) {
                map.removeLayer(currentRandomPin);
            }

            // Approximate the M25 boundaries
            const centerLat = 51.505;
            const centerLng = -0.120;
            const maxRadius = 0.1;
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.sqrt(Math.random()) * maxRadius;

            const randomLat = (centerLat + distance * Math.cos(angle)).toFixed(4);
            const randomLng = (centerLng + distance * Math.sin(angle) * 1.6).toFixed(4);

            // Create the new pin using your custom icon (if you set one up)
            currentRandomPin = L.marker([randomLat, randomLng], { icon: discoveryIcon }).addTo(map);

            // Fly to it
            map.flyTo([randomLat, randomLng], hoverZoom, {
                animate: true,
                duration: 3
            });

            // Bind the popup (Ensure closeButton: false is REMOVED so the 'X' shows up)
            currentRandomPin.bindPopup(`
                <strong>Random Discovery</strong><br>
                Lat: ${randomLat}<br>
                Lng: ${randomLng}
            `, {
                className: 'floating-text-popup',
                offset: [0, -30]
            }).openPopup();

            // ADDED: Delete the pin when the 'x' is clicked
            currentRandomPin.on('popupclose', () => {
                if (currentRandomPin) {
                    map.removeLayer(currentRandomPin);
                    currentRandomPin = null;
                }
            });

            // Hide the image panel and stop audio
            imagePanel.style.opacity = 0;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
        });




        // Click anywhere on the map to reset the view and hide panels
        map.on('click', () => {
            imagePanel.style.opacity = 0;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            map.flyTo(defaultCenter, defaultZoom, {
                animate: true,
                duration: 3
            });
        });
        // Load and display a Strava GPX track
        const gpxRoute = new L.GPX('BensCommutev1.gpx', {
            async: true,
            polyline_options: {
                color: '#0000ff',
                weight: 3,
                opacity: 0.85,
                lineCap: 'round'
            },
            marker_options: {
                startIconUrl: 'bluedot.svg',
                endIconUrl: 'bluedot.svg',
                iconSize: [25, 25],
                iconAnchor: [12.5, 12.5],
                shadowUrl: null
            }
        }).addTo(map);

                const revealRoutesButton = document.getElementById('reveal-routes-btn');
        let routePaths = [];
        let routeMarkers = [];
        let routesRevealed = false;

        revealRoutesButton.addEventListener('click', () => {
            routesRevealed = !routesRevealed;
            revealRoutesButton.setAttribute('aria-label', routesRevealed ? 'Hide Routes' : 'Reveal Routes');

            if (routesRevealed) {
                routeMarkers.forEach(marker => marker.style.opacity = '1');
                routePaths.forEach(routePath => {
                    // Apply the staggered forward animation
                    routePath.style.transition = routePath.dataset.drawTransition;
                    routePath.style.opacity = '0.85';
                    routePath.style.strokeDashoffset = '0'; 
                });
            } else {
                routeMarkers.forEach(marker => marker.style.opacity = '0');
                routePaths.forEach(routePath => {
                    // Apply a faster, uniform reverse animation to hide it
                    routePath.style.transition = routePath.dataset.hideTransition;
                    routePath.style.strokeDashoffset = routePath.dataset.totalLength; 
                    routePath.style.opacity = '0';
                });
            }
        });

        gpxRoute.on('loaded', function (e) {
            // Disable animation on the initial zoom. If the map is zooming while the browser
            // calculates the SVG pixel lengths, the measurements will be wrong!
            map.fitBounds(e.target.getBounds(), { animate: false });

            requestAnimationFrame(() => {
                routeMarkers = [...document.querySelectorAll('.leaflet-marker-icon[src$="bluedot.svg"]')];
                routeMarkers.forEach(marker => {
                    marker.style.opacity = '0';
                    marker.style.transition = 'opacity 0.5s ease';
                });

                routePaths = [...document.querySelectorAll('.leaflet-overlay-pane path')];
                
                // 1. Find the total length of ALL segments combined
                let totalRouteLength = 0;
                routePaths.forEach(routePath => {
                    totalRouteLength += routePath.getTotalLength();
                });

                const TOTAL_ANIMATION_TIME = 3; // Total seconds to draw the whole route
                let accumulatedDelay = 0;       // Keeps track of when the next segment should start

                routePaths.forEach(routePath => {
                    const routeLength = routePath.getTotalLength();
                    routePath.dataset.totalLength = routeLength;
                    
                    routePath.style.strokeDasharray = routeLength;
                    routePath.style.strokeDashoffset = routeLength;
                    routePath.style.opacity = '0';

                    // 2. Calculate how long THIS segment should take based on its size
                    const segmentDuration = (routeLength / totalRouteLength) * TOTAL_ANIMATION_TIME;
                    
                    // 3. Store the transition string using 'linear' speed so the segments 
                    // connect flawlessly without accelerating/decelerating at the joints
                    routePath.dataset.drawTransition = `stroke-dashoffset ${segmentDuration}s linear ${accumulatedDelay}s, opacity 0.2s ease`;
                    
                    // A quick 1-second transition for when you close the route
                    routePath.dataset.hideTransition = `stroke-dashoffset 1s ease 0s, opacity 1s ease`;

                    // Add this segment's time to the delay for the next segment
                    accumulatedDelay += segmentDuration;
                });

                revealRoutesButton.disabled = false;
            });
        });



    </script>
</body>

</html>
